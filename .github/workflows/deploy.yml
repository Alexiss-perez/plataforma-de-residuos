name: CD - Deploy a Producción (AWS ECS)

on:
  push:
    branches: [ "main", "master" ]

# Solo un deploy a la vez
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ============================================================
  # Job 1: Construir y pushear imágenes a ECR
  # ============================================================
  build-and-push:
    name: Build & Push a ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login a Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generar tag de imagen
        id: meta
        run: echo "tags=$(date +%Y%m%d)-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # --- Frontend ---
      - name: Build & Push Frontend
        if: hashFiles('front-web/Dockerfile') != ''
        uses: docker/build-push-action@v6
        with:
          context: ./front-web
          push: true
          tags: |
            ${{ secrets.ECR_REGISTRY }}/front-web:latest
            ${{ secrets.ECR_REGISTRY }}/front-web:${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ secrets.ECR_REGISTRY }}/front-web:cache
          cache-to: type=registry,ref=${{ secrets.ECR_REGISTRY }}/front-web:cache,mode=max

      # --- Backend API ---
      - name: Build & Push Backend
        if: hashFiles('back-api/Dockerfile') != ''
        uses: docker/build-push-action@v6
        with:
          context: ./back-api
          push: true
          tags: |
            ${{ secrets.ECR_REGISTRY }}/back-api:latest
            ${{ secrets.ECR_REGISTRY }}/back-api:${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ secrets.ECR_REGISTRY }}/back-api:cache
          cache-to: type=registry,ref=${{ secrets.ECR_REGISTRY }}/back-api:cache,mode=max

      # --- AI Orchestrator ---
      - name: Build & Push AI Orchestrator
        if: hashFiles('ai-orchestrator/Dockerfile') != ''
        uses: docker/build-push-action@v6
        with:
          context: ./ai-orchestrator
          push: true
          tags: |
            ${{ secrets.ECR_REGISTRY }}/ai-orchestrator:latest
            ${{ secrets.ECR_REGISTRY }}/ai-orchestrator:${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ secrets.ECR_REGISTRY }}/ai-orchestrator:cache
          cache-to: type=registry,ref=${{ secrets.ECR_REGISTRY }}/ai-orchestrator:cache,mode=max

  # ============================================================
  # Job 2: Desplegar a ECS Fargate
  # ============================================================
  deploy:
    name: Deploy ECS Fargate
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configurar AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Registrar nueva Task Definition
        id: task-def
        run: |
          NEW_TD=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "task_def_arn=$NEW_TD" >> $GITHUB_OUTPUT

      - name: Actualizar servicio ECS
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER_NAME }} \
            --service ${{ secrets.ECS_SERVICE_NAME }} \
            --task-definition ${{ steps.task-def.outputs.task_def_arn }} \
            --region ${{ secrets.AWS_REGION }}

      - name: Esperar que el servicio se estabilice
        run: |
          aws ecs wait services-stable \
            --cluster ${{ secrets.ECS_CLUSTER_NAME }} \
            --services ${{ secrets.ECS_SERVICE_NAME }} \
            --region ${{ secrets.AWS_REGION }}

      - name: Notificación de deploy exitoso
        run: |
          echo "Deploy completado: imagen ${{ needs.build-and-push.outputs.image_tag }}"
          echo "Cluster: ${{ secrets.ECS_CLUSTER_NAME }}"
          echo "Servicio: ${{ secrets.ECS_SERVICE_NAME }}"
