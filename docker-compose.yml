name: ecmatch

networks:
  ecmatch-net:
    driver: bridge

volumes:
  db-data:

services:
  # ============================================================
  # Base de Datos Relacional (MySQL 8.0)
  # ============================================================
  db-ecmatch:
    image: mysql:8.0
    container_name: db-ecmatch
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-ecmatch_db}
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - ecmatch-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================
  # Backend API (Spring Boot)
  # ============================================================
  back-api:
    build:
      context: ./back-api
      dockerfile: Dockerfile
    container_name: back-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db-ecmatch:3306/${DB_NAME:-ecmatch_db}?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-root}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    depends_on:
      db-ecmatch:
        condition: service_healthy
    networks:
      - ecmatch-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ============================================================
  # AI Orchestrator (Python/FastAPI + GLM 5.2)
  # ============================================================
  ai-orchestrator:
    build:
      context: ./ai-orchestrator
      dockerfile: Dockerfile
    container_name: ai-orchestrator
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GLM_API_KEY=${GLM_API_KEY}
      - GLM_MODEL=${GLM_MODEL:-glm-5.2}
      - GLM_BASE_URL=${GLM_BASE_URL}
      - BACKEND_API_URL=http://back-api:8080
      - MAPS_API_KEY=${MAPS_API_KEY}
    depends_on:
      back-api:
        condition: service_healthy
    networks:
      - ecmatch-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ============================================================
  # Frontend Web (React/Vite + Nginx)
  # ============================================================
  front-web:
    build:
      context: ./front-web
      dockerfile: Dockerfile
    container_name: front-web
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://localhost:8080
      - VITE_AI_CHAT_URL=http://localhost:8000
    depends_on:
      back-api:
        condition: service_healthy
      ai-orchestrator:
        condition: service_healthy
    networks:
      - ecmatch-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
