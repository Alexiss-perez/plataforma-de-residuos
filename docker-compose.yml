name: ecmatch

networks:
  ecmatch-net:
    driver: bridge

volumes:
  pgdata:

services:
  # ============================================================
  # Base de Datos (PostgreSQL 16 — la que usa el backend real)
  # ============================================================
  db-ecmatch:
    image: postgres:16-alpine
    container_name: db-ecmatch
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-ecmatch}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-ecmatch}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ecmatch-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ecmatch}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================
  # Backend API (FastAPI — rama feature/backend-revinculo)
  # Puerto 8000
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+psycopg://${DB_USER:-ecmatch}:${DB_PASSWORD}@db-ecmatch:5432/${DB_NAME:-ecmatch}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - AI_BASE_URL=http://ai-orchestrator:8001/v1
      - AI_API_KEY=${KOSTRA_API_KEY}
      - AI_MODEL=glm-5.2
    depends_on:
      db-ecmatch:
        condition: service_healthy
    networks:
      - ecmatch-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================
  # AI Orchestrator (GLM 5.2 — rama feature/capa-ia-agente-ecomatch)
  # Puerto 8001 (separado del backend)
  # ============================================================
  ai-orchestrator:
    build:
      context: ./ia
      dockerfile: Dockerfile
    container_name: ai-orchestrator
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - KOSTRA_API_KEY=${KOSTRA_API_KEY}
      - BACKEND_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ecmatch-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
